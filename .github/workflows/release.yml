name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: edition-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  edition:
    # The PR #2 merge commit is the ONLY automatic first-release trigger.
    # Subsequent releases require an explicit v* tag, as before.
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: publish first PDF edition after PR #2 merge') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify commit belongs to main
        run: |
          git fetch origin main --tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::A release tag must refer to a commit already on main."
            exit 1
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate book sources
        run: python3 scripts/check.py
      - name: Install PDF runtime and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc fonts-dejavu-core libpango-1.0-0 libpangocairo-1.0-0
          python3 -m pip install weasyprint==68.0 pypdf==5.9.0
      - name: Compile PDF ES and EN
        run: python3 scripts/build_pdf.py --lang all
      - name: Create release and attach both books
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAG=v2026.10.29
            if git show-ref --verify --quiet "refs/tags/$TAG"; then
              echo "::error::Tag $TAG already exists. Refusing to overwrite."
              exit 1
            fi
            # gh release create creates the tag from this merged commit and
            # publishes everything in the SAME action. No second trigger needed.
            gh release create "$TAG" \
              book/es.md book/en.md \
              dist/de-la-caja-negra-a-la-evidencia-es.pdf \
              dist/from-black-box-to-evidence-en.pdf \
              --target "$GITHUB_SHA" --title "$TAG" --notes-file CHANGELOG.md
          else
            TAG="$GITHUB_REF_NAME"
            gh release create "$TAG" \
              book/es.md book/en.md \
              dist/de-la-caja-negra-a-la-evidencia-es.pdf \
              dist/from-black-box-to-evidence-en.pdf \
              --verify-tag --title "$TAG" --notes-file CHANGELOG.md
          fi
