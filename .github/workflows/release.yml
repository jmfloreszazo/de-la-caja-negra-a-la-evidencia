name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  edition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check.py
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" book/es.md book/en.md --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
