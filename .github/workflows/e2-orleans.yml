name: E2 Orleans PostgreSQL functional experiment

on:
  pull_request:
    paths:
      - 'lab/e2_orleans/**'
      - '.github/workflows/e2-orleans.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orleans-functional:
    name: Orleans grain, SQL oracle and synthetic workloads
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      E1_PG_DSN: "host=127.0.0.1 port=55434 dbname=e2lab user=postgres password=e2local"
      E1_PG_NPGSQL: "Host=127.0.0.1;Port=55434;Database=e2lab;Username=postgres;Password=e2local;Pooling=false"
      E2_PG_NPGSQL: "Host=127.0.0.1;Port=55434;Database=e2lab;Username=postgres;Password=e2local;Pooling=true;Maximum Pool Size=32"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install exact E1 PostgreSQL test oracle dependencies
        run: python3 -m pip install -r lab/e1_pg/requirements.txt
      - name: Compile protected reference, E1 PostgreSQL and new E2 Orleans host
        run: |
          dotnet build lab/Bank/Bank.csproj -c Release -m:1 --disable-build-servers
          dotnet build lab/e1_pg/PgBank/PgBank.csproj -c Release -m:1 --disable-build-servers
          dotnet build lab/e2_orleans/OrleansLab/OrleansLab.csproj -c Release -m:1 --disable-build-servers
      - name: Start disposable PostgreSQL 16.13 in Podman
        run: |
          podman run -d --name e2-postgres \
            -e POSTGRES_PASSWORD=e2local -e POSTGRES_DB=e2lab \
            -p 127.0.0.1:55434:5432 docker.io/library/postgres:16.13
          ready=0
          for attempt in $(seq 1 60); do
            if podman exec e2-postgres pg_isready -U postgres -d e2lab >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          mkdir -p lab/results/e2
          podman image inspect docker.io/library/postgres:16.13 \
            --format '{{json .RepoDigests}}' > lab/results/e2/postgresql-repo-digests.json
          dotnet --version > lab/results/e2/dotnet-sdk.txt
          podman --version > lab/results/e2/podman-version.txt
      - name: Execute direct and real Orleans grain differential controls
        run: python3 lab/e2_orleans/test_e2.py
      - name: Require a real PostgreSQL 40P01 and full-transaction recovery on each route
        run: python3 lab/e2_orleans/test_deadlock.py
      - name: Verify fixed-seed 1000-account route parity and hot-key workloads
        run: python3 lab/e2_orleans/test_workloads.py
      - name: Exercise real Orleans cohost SIGKILL, recovery and negative split oracle
        run: python3 lab/e2_orleans/test_process_crash.py
      - name: Upload original, non-promoted E2 smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2-orleans-smoke
          path: lab/results/e2/
          if-no-files-found: warn
      - name: Stop disposable PostgreSQL
        if: always()
        run: |
          podman logs --tail 40 e2-postgres || true
          podman rm -f e2-postgres || true
