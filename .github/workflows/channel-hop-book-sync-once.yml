name: One-shot generated bilingual channel hop book sync
on:
  push:
    branches: [feature/channel-hop-faults-30]
    paths: ['.github/workflows/channel-hop-book-sync-once.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/channel-hop-faults-30
      - name: Rebuild canonical ES and EN whole-book files
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feature/channel-hop-faults-30"
          python3 scripts/build.py
          git add book/es.md book/en.md
          if git diff --cached --quiet; then
            echo 'No book changes'
            exit 0
          fi
          git -c user.name=github-actions[bot] \
            -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "docs(book): regenerate bilingual channel hop fault section"
          git push origin HEAD:refs/heads/feature/channel-hop-faults-30
