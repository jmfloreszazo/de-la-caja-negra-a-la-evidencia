name: Book
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: links, es/en sync, generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check.py
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes markdownlint-cli2@0.22.0 "**/*.md"
  diagrams:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @mermaid-js/mermaid-cli@11.12.0
      - run: MERMAID_PUPPETEER_CONFIG=.github/puppeteer-config.json python3 scripts/render_figures.py --check
