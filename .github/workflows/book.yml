name: Book
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: links, es/en sync, generated files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check_language_policy.py --self-test
      - run: python3 scripts/check_language_policy.py
      - run: python3 scripts/check.py
      - run: python3 -m unittest discover -s scripts -p test_render_figures.py -v
  checkout-integrity:
    name: checkout byte integrity (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p test_checkout_integrity.py -v
  markdown:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npx --yes markdownlint-cli2@0.22.0 "**/*.md"
  diagrams:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install -g @mermaid-js/mermaid-cli@11.12.0
      - run: MERMAID_PUPPETEER_CONFIG=.github/puppeteer-config.json python3 scripts/render_figures.py --check
