name: Brand artwork
on:
  push:
    branches: [design/brand-v5-approved-review]
    paths: ['assets/src/**', 'assets/*.svg', '.github/workflows/brand-artwork.yml']
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate exact approved SVG icons and related lockups
        run: node assets/src/make_brand.mjs
      - name: Install pinned SVG rasterizer
        run: python3 -m pip install cairosvg==2.9.1
      - name: Regenerate PNG mirrors
        run: python3 assets/src/render.py
      - name: Commit deterministic graphic outputs on this design branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg assets/*.png
          if ! git diff --cached --quiet; then
            git commit -m "design: render reference-exact B icon and synced artwork"
            git push origin HEAD:design/brand-v5-approved-review
          fi
