name: One-time V5 icon export and obsolete branch cleanup
on:
  push:
    branches: ['design/brand-v5-approved-review']
    paths:
      - 'assets/src/make_brand.mjs'
      - '.github/workflows/brand-artwork.yml'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate SVGs from canonical source
        run: node assets/src/make_brand.mjs
      - name: Rasterise and verify the new mark
        run: |
          python3 -m pip install cairosvg==2.9.1
          python3 assets/src/render.py
          python3 assets/src/check_brand.py
      - name: Commit SVG and PNG exports on the active review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg assets/*.png
          if ! git diff --cached --quiet; then
            git commit -m "design: restore vertical gate jamb in variant B icon"
            git push origin HEAD:design/brand-v5-approved-review
          fi
      - name: Delete obsolete closed-PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/1" --jq .state)" = "closed"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/2" --jq .state)" = "open"
          if git ls-remote --exit-code --heads origin refs/heads/design/align-jmfloreszazo-v5 > /dev/null 2>&1; then
            git push origin --delete design/align-jmfloreszazo-v5
          fi
