name: One-time native held ACK bilingual manuscript regeneration
on:
  push:
    branches: [feature/channels-held-reply-concurrent-recovery-30]
    paths: ['.github/workflows/channel-held-ack-book-sync-once.yml']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/channels-held-reply-concurrent-recovery-30
          fetch-depth: 0
      - name: Build ES and EN canonical full books
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "jmfloreszazo/de-la-caja-negra-a-la-evidencia"
          test "$GITHUB_REF" = "refs/heads/feature/channels-held-reply-concurrent-recovery-30"
          python3 scripts/build.py
          git add -- book/es.md book/en.md
          if git diff --cached --quiet; then
            echo "Generated bilingual manuscripts unchanged"
            exit 0
          fi
          git -c user.name=github-actions[bot] \
            -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "docs(book): regenerate both editions with held-ACK concurrency chapter"
          git push origin HEAD:refs/heads/feature/channels-held-reply-concurrent-recovery-30
