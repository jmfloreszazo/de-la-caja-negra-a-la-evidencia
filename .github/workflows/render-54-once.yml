name: Render #54 source-of-truth figures (one-time)
on:
  push:
    branches:
      - book/functional-first-diagrams-54
    paths:
      - '.github/workflows/render-54-once.yml'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm install -g @mermaid-js/mermaid-cli@11.12.0
      - name: Regenerate exact Mermaid PNGs, provenance and both full books
        run: |
          set -euo pipefail
          MERMAID_PUPPETEER_CONFIG=.github/puppeteer-config.json python3 scripts/render_figures.py
          python3 scripts/build.py
          python3 scripts/check.py
          python3 scripts/check_figure_provenance.py --self-test
      - name: Commit only generated assets to #54 branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            book/figures/es/agent_chain.png \
            book/figures/en/agent_chain.png \
            book/figures/es/c4_containers.png \
            book/figures/en/c4_containers.png \
            book/figures/hashes.json \
            book/es.md book/en.md
          if git diff --cached --quiet; then
            echo 'No generated changes to publish'
          else
            git commit -m 'book(#54): regenerate verified brownfield diagram images and ES/EN editions'
            git push origin HEAD:book/functional-first-diagrams-54
          fi
