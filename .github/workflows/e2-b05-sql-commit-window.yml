name: E2 B05 actual PostgreSQL COMMIT timestamps over 60s (NOT capacity)

on:
  pull_request:
    paths:
      - 'lab/e2_orleans/**'
      - '.github/workflows/e2-b05-sql-commit-window.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-sql-commit-time:
    name: E2-B05 real 60s UTC COMMIT stamps, direct vs Orleans, independent SQL ledger
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      E2_NETWORK_TEST: '1'
      E1_PG_DSN: 'host=127.0.0.1 port=55435 dbname=e2lab user=postgres password=e2local'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install independent SQL oracle dependencies
        run: python3 -m pip install -r lab/e1_pg/requirements.txt
      - name: Check Python source and offer-vector contract
        run: |
          python3 -m py_compile lab/e2_orleans/test_b05_sql_commit_window.py
          python3 -m py_compile lab/e2_orleans/test_b05_repeatability.py lab/e2_orleans/b05_arrival_contract.py
          python3 -m unittest discover -s lab/e2_orleans -p 'test_b05_arrival_contract.py' -v
      - name: Publish exact .NET 10 Orleans and B05 client binaries
        run: |
          mkdir -p lab/results/e2f10/b05-commit-window
          dotnet publish lab/e2_orleans/OrleansLab/OrleansLab.csproj \
            --disable-build-servers -c Release -m:1 \
            -o lab/results/e2f10/app
          dotnet --version > lab/results/e2f10/b05-commit-window/dotnet-version.txt
          podman --version > lab/results/e2f10/b05-commit-window/podman-version.txt
          podman info --format '{{.Host.NetworkBackend}}' \
            > lab/results/e2f10/b05-commit-window/podman-network-backend.txt
      - name: Run one-host 60s independent PostgreSQL COMMIT timing pilot
        run: python3 lab/e2_orleans/test_b05_sql_commit_window.py
      - name: Archive original per-operation PostgreSQL COMMIT timestamps, even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2-b05-postgresql-60s-original-commit-time-not-capacity
          path: |
            lab/results/e2f10/b05-commit-window/*.json
            lab/results/e2f10/b05-commit-window/*.txt
          if-no-files-found: warn
      - name: Remove all disposable Podman containers and networks
        if: always()
        run: |
          for name in e2f10-client e2f10-secondary e2f10-primary e2f10-pg; do
            podman rm -f "$name" 2>/dev/null || true
          done
          for name in e2f10-sql e2f10-net; do
            podman network rm "$name" 2>/dev/null || true
          done
