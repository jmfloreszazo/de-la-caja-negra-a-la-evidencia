name: E2 C01 controlled acceptance and explicit default-placement diagnostic

on:
  pull_request:
    paths:
      - 'lab/e2_orleans/**'
      - '.github/workflows/e2-f10-podman.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Controlled acceptance or strict historical default-policy diagnostic
        type: choice
        options: [controlled, historical-default]
        default: controlled

permissions:
  contents: read

jobs:
  podman-network-namespaces:
    name: E2-C01 controlled alternative or strict historical diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      E2_NETWORK_TEST: '1'
      C01_COHORT: '1'
      E1_PG_DSN: 'host=127.0.0.1 port=55435 dbname=e2lab user=postgres password=e2local'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install exact PostgreSQL oracle requirements
        run: python3 -m pip install -r lab/e1_pg/requirements.txt
      - name: Validate placement preconditions with nine offline negative controls
        run: |
          python3 -m py_compile lab/e2_orleans/test_podman_network.py lab/e2_orleans/placement_contract.py lab/e2_orleans/test_c01_placement_contract.py
          python3 -m unittest discover -s lab/e2_orleans -p 'test_c01_placement_contract.py' -v
      - name: Publish Orleans 10.4.0 .NET 10 app for Podman ASP.NET runtime containers
        run: |
          mkdir -p lab/results/e2f10/c01-controlled
          dotnet publish lab/e2_orleans/OrleansLab/OrleansLab.csproj \
            -c Release -m:1 --disable-build-servers -o lab/results/e2f10/app
          dotnet --version > lab/results/e2f10/dotnet-sdk.txt
          podman --version > lab/results/e2f10/podman-version.txt
      - name: Capture exact source provenance for the controlled alternative
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "source_head_sha=$SOURCE_HEAD_SHA" > lab/results/e2f10/c01-controlled/provenance.txt
          echo "checkout_sha=$(git rev-parse HEAD)" >> lab/results/e2f10/c01-controlled/provenance.txt
          test "$SOURCE_HEAD_SHA" = "$(git rev-parse HEAD)"
          echo "cohort=$C01_COHORT runner=$RUNNER_NAME" >> lab/results/e2f10/c01-controlled/provenance.txt
          git ls-files lab/e2_orleans lab/e1_pg .github/workflows/e2-f10-podman.yml | xargs sha256sum >> lab/results/e2f10/c01-controlled/provenance.txt
      - name: Require one-sided rejection and controlled dual-host recovery
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'controlled'
        run: python3 lab/e2_orleans/test_controlled_placement.py
      - name: Execute the unchanged strict historical default-policy diagnostic
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'historical-default'
        run: python3 lab/e2_orleans/test_podman_network.py
      - name: Upload original raw topology, membership, oracle and schema provenance
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2-c01-explicit-mode-original
          path: |
            lab/results/e2f10/*.json
            lab/results/e2f10/c01-controlled/
          if-no-files-found: warn
      - name: Remove disposable containers and network after test failure
        if: always()
        run: |
          for name in e2f10-client e2f10-secondary e2f10-primary e2f10-pg; do
            podman rm -f "$name" 2>/dev/null || true
          done
          podman network rm e2f10-net 2>/dev/null || true
