name: Synthetic channels native and separate SQL stores
on:
  push:
    branches: [main]
    paths: ['lab/channels/**', 'evidence/channels/**', 'scripts/check_channel_observations.py', 'scripts/check_channel_transport.py', 'scripts/test_channel_transport_evidence.py', '.github/workflows/channels-synthetic.yml']
  pull_request:
    paths: ['lab/channels/**', 'evidence/channels/**', 'scripts/check_channel_observations.py', 'scripts/check_channel_transport.py', 'scripts/test_channel_transport_evidence.py', '.github/workflows/channels-synthetic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CHANNELS_DISPOSABLE: 'YES'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: python3 -m pip install -r lab/e1_pg/requirements.txt
      - name: Audit frozen originals and historical source identities
        run: |
          git fetch --no-tags --depth=1 origin 065b82b3b1b6ac2f8b7a1dab0622afbf08719732 b057a875fc1485ae804222d7035e4d602271bbaf dd6cbb5c455907d6555fd1196f504be73eadc7eb 1b206b137074c3ab175c4234d8f69780217fbb97
          python3 scripts/check_channel_observations.py
      - name: Execute 18 one-shot TCP proxy refusal and held-ACK barrier controls
        run: |
          set -o pipefail
          mkdir -p lab/results/channels
          python3 -m unittest discover -s lab/channels -p test_transport_proxy.py -v 2>&1 \
            | tee lab/results/channels/transport-guards-original.log
          grep -q 'Ran 18 tests' lab/results/channels/transport-guards-original.log
      - name: Execute native HTTP/PostgreSQL and four real TCP faults including concurrent held-ACK recovery
        run: python3 lab/channels/run.py
      - name: Verify four real loopback TCP witnesses, held-ACK ordering and independent SQL
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          python3 scripts/check_channel_transport.py lab/results/channels/original.json \
            | tee lab/results/channels/transport-original-gate.json
      - name: Reject 26 forged native evidence claims including duplicate recovery
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHANNELS_ORIGINAL_REPORT: lab/results/channels/original.json
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts -p test_channel_transport_evidence.py -v 2>&1 \
            | tee lab/results/channels/transport-evidence-mutants-original.log
          grep -q 'Ran 27 tests' lab/results/channels/transport-evidence-mutants-original.log
      - name: Preserve original observations on every outcome
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: channels-synthetic-original
          path: |
            lab/results/channels/*.json
            lab/results/channels/*.log
          if-no-files-found: warn
