name: Temporary sync bilingual M2 book manuscript
on:
  push:
    branches: [experiment/e1-postgres-row-locking]
    paths:
      - '.github/workflows/sync-book-previews.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/build.py
      - name: Commit generated Markdown manuscript only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book/es.md book/en.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(book): incorporate observed M2 experiment in ES and EN"
            git push origin HEAD:experiment/e1-postgres-row-locking
          fi
