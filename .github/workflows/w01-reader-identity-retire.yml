name: Retire integrated W01 restricted-reader branch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/w01-reader-identity-retire.yml'
permissions:
  contents: write
  pull-requests: read
jobs:
  retire:
    if: startsWith(github.event.head_commit.message, 'Merge W01 restricted-reader increment')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Retire only exact merged branch tip with lease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.parse
          repo = os.environ['GITHUB_REPOSITORY']
          branch = 'feature/w01-source-reader-least-privilege-32'
          assert repo == 'jmfloreszazo/de-la-caja-negra-a-la-evidencia'
          assert os.environ['GITHUB_REF'] == 'refs/heads/main'
          sha = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert sha == os.environ['GITHUB_SHA']
          query = ('repos/' + repo + '/pulls?state=closed&head=' +
                   urllib.parse.quote(repo.split('/')[0]+':'+branch,safe=''))
          prs = json.loads(subprocess.check_output(['gh','api',query],text=True))
          merged = [p for p in prs if p['merged_at'] and p['base']['ref']=='main'
                    and p['merge_commit_sha']==sha]
          assert len(merged)==1
          old = merged[0]['head']['sha']
          subprocess.run(['git','merge-base','--is-ancestor',old,'HEAD'],check=True)
          current = subprocess.check_output(
              ['git','ls-remote','origin','refs/heads/'+branch],text=True).strip()
          if current:
              assert current.split()[0]==old,'Source branch changed; refuse removal'
              subprocess.run(['git','push','--force-with-lease=refs/heads/'+branch+':'+old,
                              'origin',':refs/heads/'+branch],check=True)
          assert not subprocess.check_output(
              ['git','ls-remote','origin','refs/heads/'+branch],text=True).strip()
          print('Retired exact integrated W01 restricted-reader branch',old)
          PY
