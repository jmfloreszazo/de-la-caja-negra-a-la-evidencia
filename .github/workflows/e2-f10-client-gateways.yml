name: E2 F10 C04 external-client gateway isolation

on:
  pull_request:
    paths:
      - 'lab/e2_orleans/**'
      - '.github/workflows/e2-f10-client-gateways.yml'
  push:
    branches: [main]
    paths:
      - 'lab/e2_orleans/**'
      - '.github/workflows/e2-f10-client-gateways.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-gateway-isolation:
    name: E2-F10 C04 client gateway cuts and 7/7 independent SQL oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      E2_NETWORK_TEST: '1'
      E1_PG_DSN: 'host=127.0.0.1 port=55435 dbname=e2lab user=postgres password=e2local'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install PostgreSQL independent SQL Oracle Gate
        run: python3 -m pip install -r lab/e1_pg/requirements.txt
      - name: Validate Python sources before starting disposable infrastructure
        run: |
          python3 -m py_compile \
            lab/e2_orleans/test_client_gateway_partition.py \
            lab/e2_orleans/test_podman_disconnect.py \
            lab/e2_orleans/test_podman_network.py
      - name: Reject unrelated client failures before network execution
        run: python3 -m unittest discover -s lab/e2_orleans -p test_gateway_failure_contract.py -v
      - name: Build Orleans 10.4.0 and capture environment provenance
        run: |
          mkdir -p lab/results/e2f10/c04
          dotnet publish lab/e2_orleans/OrleansLab/OrleansLab.csproj \
            -c Release -m:1 --disable-build-servers \
            -o lab/results/e2f10/app
          dotnet --version > lab/results/e2f10/c04/dotnet-sdk.txt
          podman --version > lab/results/e2f10/c04/podman-version.txt
          podman info --format '{{.Host.NetworkBackend}}' \
            > lab/results/e2f10/c04/network-backend.txt
          podman pull docker.io/nicolaka/netshoot:v0.13
      - name: Record exact source and environment before network injection
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "source_head_sha=$SOURCE_HEAD_SHA" > lab/results/e2f10/c04/provenance.txt
          echo "checkout_sha=$(git rev-parse HEAD)" >> lab/results/e2f10/c04/provenance.txt
          test "$SOURCE_HEAD_SHA" = "$(git rev-parse HEAD)"
          uname -a >> lab/results/e2f10/c04/provenance.txt
          git ls-files lab/e2_orleans lab/e1_pg .github/workflows/e2-f10-client-gateways.yml | xargs sha256sum >> lab/results/e2f10/c04/provenance.txt
      - name: Cut external client gateway paths and reconcile SQL independently
        run: python3 lab/e2_orleans/test_client_gateway_partition.py
      - name: Upload original PASS or FAIL observations unmodified
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2-f10-c04-original-client-gateway
          path: |
            lab/results/e2f10/c04/*.json
            lab/results/e2f10/c04/*.txt
          if-no-files-found: warn
      - name: Clean disposable containers and private networks
        if: always()
        shell: bash
        run: |
          for name in e2f10-client e2f10-secondary e2f10-primary e2f10-pg; do
            podman rm -f "$name" 2>/dev/null || true
          done
          for name in e2f10-sql e2f10-net; do
            podman network rm "$name" 2>/dev/null || true
          done
