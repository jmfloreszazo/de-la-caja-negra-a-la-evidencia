name: E2 B05 real external open-loop functional smoke (NOT capacity)

on:
  pull_request:
    paths:
      - 'lab/e2_orleans/**'
      - '.github/workflows/e2-b05-external-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-offers-and-independent-sql:
    name: E2-B05 two real silos, external scheduled client and independent SQL 7/7
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      E2_NETWORK_TEST: '1'
      E1_PG_DSN: 'host=127.0.0.1 port=55435 dbname=e2lab user=postgres password=e2local'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install independent SQL oracle
        run: python3 -m pip install -r lab/e1_pg/requirements.txt
      - name: Validate Python and pure generated arrival contracts
        run: |
          python3 -m py_compile lab/e2_orleans/test_b05_external_smoke.py lab/e2_orleans/b05_arrival_contract.py
          python3 -m unittest discover -s lab/e2_orleans -p 'test_b05_arrival_contract.py' -v
      - name: Build external .NET 10 client and Orleans silo with provenance
        run: |
          mkdir -p lab/results/e2f10/b05-smoke
          dotnet publish lab/e2_orleans/OrleansLab/OrleansLab.csproj \
            --disable-build-servers -c Release -m:1 \
            -o lab/results/e2f10/app
          dotnet --version > lab/results/e2f10/b05-smoke/dotnet-version.txt
          podman --version > lab/results/e2f10/b05-smoke/podman-version.txt
          podman info --format '{{.Host.NetworkBackend}}' \
            > lab/results/e2f10/b05-smoke/podman-network-backend.txt
      - name: Execute bounded real arrivals on independent client and inspect durable SQL
        run: python3 lab/e2_orleans/test_b05_external_smoke.py
      - name: Archive original PASS or FAIL traces, not a capacity benchmark
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2-b05-external-openloop-smoke-original-not-sustained-capacity
          path: |
            lab/results/e2f10/b05-smoke/*.json
            lab/results/e2f10/b05-smoke/*.txt
          if-no-files-found: warn
      - name: Force cleanup disposable Podman containers and networks
        if: always()
        run: |
          for name in e2f10-client e2f10-secondary e2f10-primary e2f10-pg; do
            podman rm -f "$name" 2>/dev/null || true
          done
          for network in e2f10-sql e2f10-net; do
            podman network rm "$network" 2>/dev/null || true
          done
