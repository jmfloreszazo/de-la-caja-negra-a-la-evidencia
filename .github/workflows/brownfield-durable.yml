name: Brownfield durable SQL capability
on:
  pull_request:
    paths:
      - 'lab/brownfield/durable/**'
      - '.github/workflows/brownfield-durable.yml'
  push:
    branches: [main]
    paths:
      - 'lab/brownfield/durable/**'
      - '.github/workflows/brownfield-durable.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-sql-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install independent SQL oracle
        run: python3 -m pip install -r lab/e1_pg/requirements.txt
      - name: Start isolated PostgreSQL 16.13 and verify host connectivity
        run: |
          podman run -d --name bf-pg \
            -e POSTGRES_PASSWORD=bflocal -e POSTGRES_DB=bf_lab \
            -p 127.0.0.1:55437:5432 docker.io/library/postgres:16.13
          ready=0
          for i in $(seq 1 60); do
            if podman exec bf-pg pg_isready -U postgres -d bf_lab >/dev/null 2>&1 \
              && python3 -c 'import psycopg; c=psycopg.connect("host=127.0.0.1 port=55437 dbname=bf_lab user=postgres password=bflocal"); c.close()' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
      - name: Capture environment and original source identity
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p lab/results/brownfield
          echo "source_head_sha=$SOURCE_HEAD_SHA" > lab/results/brownfield/provenance.txt
          echo "checkout_sha=$(git rev-parse HEAD)" >> lab/results/brownfield/provenance.txt
          uname -a >> lab/results/brownfield/provenance.txt
          dotnet --info >> lab/results/brownfield/provenance.txt
          podman version >> lab/results/brownfield/provenance.txt
          podman image inspect docker.io/library/postgres:16.13 \
            --format '{{.Id}} {{json .RepoDigests}}' >> lab/results/brownfield/provenance.txt
      - name: Run .NET 10 durable transfer failure matrix and independent SQL oracle
        env:
          BROWNFIELD_DISPOSABLE: 'YES'
          BROWNFIELD_PG_DSN: 'host=127.0.0.1 port=55437 dbname=bf_lab user=postgres password=bflocal'
          BROWNFIELD_PG_NPGSQL: 'Host=127.0.0.1;Port=55437;Database=bf_lab;Username=postgres;Password=bflocal;Pooling=false'
        run: python3 lab/brownfield/durable/test_durable.py
      - name: Upload original outcomes and negative evidence even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: brownfield-synthetic-postgresql-not-business-g6
          path: lab/results/brownfield/
          if-no-files-found: warn
      - name: Destroy isolated PostgreSQL fixture
        if: always()
        run: |
          podman logs --tail 100 bf-pg || true
          podman rm -f bf-pg || true
