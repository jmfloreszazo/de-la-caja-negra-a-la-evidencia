name: One-time SHA-and-ancestry-gated cleanup of B05 hot-sweep merged branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e2-b05-40-80-prune.yml'

permissions:
  contents: write

concurrency:
  group: once-b05-hot-sweep-and-evidence-branches
  cancel-in-progress: false

jobs:
  exact-head-prune:
    name: Delete only the exact merged heads for PR 43 and 45
    if: >-
      ${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'merge: E2 B05 40 80 original evidence') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Guard exact branch refs, merged PRs and ancestry first
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "jmfloreszazo/de-la-caja-negra-a-la-evidencia"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          verify() {
            local pr="$1" branch="$2" expected current
            test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.merged')" = "true"
            expected="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.sha')"
            test -n "$expected"
            current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            test "$current" = "$expected" || {
              echo "::error::Branch moved or does not match PR HEAD"
              exit 1
            }
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git merge-base --is-ancestor "$expected" HEAD || {
              echo "::error::Ref is not an ancestor of main"
              exit 1
            }
          }
          verify 43 experiment/e2-b05-40-80s-commit-sweep
          verify 45 docs/e2-b05-40-80-original-evidence
          for branch in experiment/e2-b05-40-80s-commit-sweep docs/e2-b05-40-80-original-evidence; do
            case "$branch" in
              experiment/e2-b05-40-80s-commit-sweep) pr=43 ;;
              docs/e2-b05-40-80-original-evidence) pr=45 ;;
              *) echo "::error::Unknown branch"; exit 1 ;;
            esac
            current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            expected="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.sha')"
            test "$current" = "$expected" || {
              echo "::error::Concurrent ref movement, no deletion"
              exit 1
            }
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          done
          echo "Deleted only merged experimental/evidence heads; C04 unaffected"
