name: Evidence claims
on:
  push:
    paths:
      - 'evidence/**'
      - 'docs/EVIDENCE*.md'
      - 'scripts/check_evidence.py'
      - 'scripts/test_evidence_api_retry.py'
      - 'scripts/historical_source.py'
      - 'scripts/test_historical_source.py'
      - 'scripts/check_e1_observations.py'
      - 'scripts/check_e1c_observations.py'
      - 'scripts/check_e1c_worker_observations.py'
      - 'scripts/check_e2_observations.py'
      - 'scripts/check_e2_workload_observations.py'
      - 'scripts/check_e2_process_kill_observations.py'
      - 'scripts/check_e2_inflight_observations.py'
      - 'scripts/check_e2_podman_observations.py'
      - 'scripts/check_e2_live_network_loss_observations.py'
      - 'scripts/check_e2_sql_partition_observations.py'
      - 'scripts/check_e2_client_gateway_observations.py'
      - 'scripts/check_e2_controlled_placement_observations.py'
      - 'scripts/check_e2_placement_observation.py'
      - 'scripts/check_e2_long_partition_observations.py'
      - 'scripts/check_e2_activation_observations.py'
      - 'scripts/audit_e2_activation_artifact.py'
      - 'lab/e2_activation_observer/observation.py'
      - 'scripts/check_e2_directional_partition_observations.py'
      - 'scripts/check_e2_b05_external_smoke.py'
      - 'scripts/check_e2_b05_repeatability_observations.py'
      - 'scripts/check_e2_b05_sql_commit_window.py'
      - 'scripts/check_e2_b05_hot_40_80_observations.py'
      - 'scripts/check_e2_b05_160_320_observations.py'
      - 'scripts/check_m1_observations.py'
      - 'scripts/check_m2_observations.py'
      - '.github/workflows/evidence.yml'
  pull_request:
    paths:
      - 'evidence/**'
      - 'docs/EVIDENCE*.md'
      - 'scripts/check_evidence.py'
      - 'scripts/historical_source.py'
      - 'scripts/test_historical_source.py'
      - 'scripts/check_e1_observations.py'
      - 'scripts/check_e1c_observations.py'
      - 'scripts/check_e1c_worker_observations.py'
      - 'scripts/check_e2_observations.py'
      - 'scripts/check_e2_workload_observations.py'
      - 'scripts/check_e2_process_kill_observations.py'
      - 'scripts/check_e2_inflight_observations.py'
      - 'scripts/check_e2_podman_observations.py'
      - 'scripts/check_e2_live_network_loss_observations.py'
      - 'scripts/check_e2_sql_partition_observations.py'
      - 'scripts/check_e2_client_gateway_observations.py'
      - 'scripts/check_e2_controlled_placement_observations.py'
      - 'scripts/check_e2_placement_observation.py'
      - 'scripts/check_e2_long_partition_observations.py'
      - 'scripts/check_e2_activation_observations.py'
      - 'scripts/audit_e2_activation_artifact.py'
      - 'lab/e2_activation_observer/observation.py'
      - 'scripts/check_e2_directional_partition_observations.py'
      - 'scripts/check_e2_b05_external_smoke.py'
      - 'scripts/check_e2_b05_repeatability_observations.py'
      - 'scripts/check_e2_b05_sql_commit_window.py'
      - 'scripts/check_e2_b05_hot_40_80_observations.py'
      - 'scripts/check_e2_b05_160_320_observations.py'
      - 'scripts/check_m1_observations.py'
      - 'scripts/check_m2_observations.py'
      - '.github/workflows/evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  registry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/test_historical_source.py
      - run: python3 scripts/test_evidence_api_retry.py
      - run: python3 scripts/check_evidence.py
      - run: python3 scripts/check_e1_observations.py
      - run: python3 scripts/check_e1c_observations.py
      - run: python3 scripts/check_e1c_worker_observations.py
      - run: python3 scripts/check_e2_observations.py
      - run: python3 scripts/check_e2_workload_observations.py
      - run: python3 scripts/check_e2_process_kill_observations.py
      - run: python3 scripts/check_e2_inflight_observations.py
      - run: python3 scripts/check_e2_podman_observations.py
      - run: python3 scripts/check_e2_live_network_loss_observations.py
      - run: python3 scripts/check_e2_sql_partition_observations.py
      - run: python3 scripts/check_e2_client_gateway_observations.py
      - run: python3 scripts/check_e2_controlled_placement_observations.py
      - run: python3 scripts/check_e2_placement_observation.py
      - run: python3 scripts/check_e2_long_partition_observations.py
      - name: Retrieve exact original observer source for offline hash audit
        run: git fetch --no-tags --depth=1 origin 362ee5a7537e1523caad2bd7033ec7a99977ac2d
      - run: python3 scripts/check_e2_activation_observations.py
      - run: python3 scripts/check_e2_directional_partition_observations.py
      - run: python3 scripts/check_e2_b05_external_smoke.py
      - run: python3 scripts/check_e2_b05_repeatability_observations.py
      - run: python3 scripts/check_e2_b05_sql_commit_window.py
      - run: python3 scripts/check_e2_b05_hot_40_80_observations.py
      - run: python3 scripts/check_e2_b05_160_320_observations.py
      - run: python3 scripts/check_m1_observations.py
      - run: python3 scripts/check_m2_observations.py
  provenance:
    name: Live run and release provenance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/test_evidence_api_retry.py
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_evidence.py --online
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_m1_observations.py --online
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_m2_observations.py --online
