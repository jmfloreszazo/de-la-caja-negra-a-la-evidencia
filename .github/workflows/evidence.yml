name: Evidence claims
on:
  push:
    paths:
      - 'evidence/**'
      - 'docs/EVIDENCE*.md'
      - 'scripts/check_evidence.py'
      - '.github/workflows/evidence.yml'
  pull_request:
    paths:
      - 'evidence/**'
      - 'docs/EVIDENCE*.md'
      - 'scripts/check_evidence.py'
      - '.github/workflows/evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check_evidence.py
