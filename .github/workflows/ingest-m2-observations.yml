name: One-off ingest verified M2 full report
on:
  push:
    branches: [experiment/e1-postgres-row-locking]
    paths:
      - '.github/workflows/ingest-m2-observations.yml'
permissions:
  contents: write
  actions: read
jobs:
  ingest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Download only confirmed successful M2 CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "jmfloreszazo/de-la-caja-negra-a-la-evidencia"
          test "$GITHUB_REF" = "refs/heads/experiment/e1-postgres-row-locking"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/41016081107" --jq '.conclusion')" = "success"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/41016081107" --jq '.head_sha')" = "c9152d50c9ca713eda0627341233221b9c1180a3"
          gh run download 41016081107 --repo "$GITHUB_REPOSITORY"             -n m2-durable-sql-local-replica-smoke-not-azure -D /tmp/m2artifact
          test -f /tmp/m2artifact/results/m2/summary.json
          cp /tmp/m2artifact/results/m2/summary.json evidence/runs/m2-full-summary.json
      - name: Validate archived original report and both formats
        run: python3 scripts/check_m2_observations.py
      - name: Commit only audited raw JSON to draft PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/runs/m2-full-summary.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence(m2): pin original complete 20-case CI report and independent SQL oracle output"
            git push origin HEAD:experiment/e1-postgres-row-locking
          fi
