name: One-time exact-SHA cleanup of merged B05 hot 40/80 sweep branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e2-b05-hot-40-80-prune.yml'

permissions:
  contents: write

concurrency:
  group: once-e2-b05-hot-40-80-prune
  cancel-in-progress: false

jobs:
  prune-after-verified-merge:
    name: Remove only merged PR 43/46 refs after SHA + ancestry verification
    if: >-
      ${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'merge: E2 B05 hot 40 80 evidence') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify both PRs merged, exact branch heads and ancestry before deletion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "jmfloreszazo/de-la-caja-negra-a-la-evidencia"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          verify() {
            local pr="$1" branch="$2" expected current
            test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.merged')" = "true"
            expected="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.sha')"
            test -n "$expected"
            current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            test "$current" = "$expected" || {
              echo "::error::Branch moved; do not delete"
              exit 1
            }
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git merge-base --is-ancestor "$expected" HEAD || {
              echo "::error::Unmerged branch change; abort"
              exit 1
            }
          }
          verify 43 experiment/e2-b05-40-80s-commit-sweep
          verify 46 docs/e2-b05-40-80-sql-evidence
          for branch in experiment/e2-b05-40-80s-commit-sweep docs/e2-b05-40-80-sql-evidence; do
            case "$branch" in
              experiment/e2-b05-40-80s-commit-sweep) pr=43 ;;
              docs/e2-b05-40-80-sql-evidence) pr=46 ;;
              *) echo "::error::Unexpected branch"; exit 1 ;;
            esac
            current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            expected="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.sha')"
            test "$current" = "$expected" || {
              echo "::error::Concurrent branch movement; preserve ref"
              exit 1
            }
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "Deleted exact merged PR $pr branch at $expected"
          done
