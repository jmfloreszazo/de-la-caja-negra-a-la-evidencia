name: One-time prune of verified merged E1/E2 branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-merged-e1-e2.yml'

permissions:
  contents: write

concurrency:
  group: one-time-merged-e1-e2-prune
  cancel-in-progress: false

jobs:
  prune-verified-branches:
    name: Delete exact E1/E2 heads only after ancestry and lease checks
    if: >-
      ${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'merge: prune verified merged E1 E2 branches') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fail closed and delete only three already-merged experiment refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          # Snapshot SHA leases verified by comparing each old branch with
          # main after PR #19 merged. Never delete a changed branch.
          declare -A expected=(
            [experiment/e1-postgres-row-locking]=5053d50f4dffc4899cec1277d4b63b4512609c3d
            [experiment/e2-orleans-durable-ledger]=e87d873759460b1437a54afe116d4a2e9b85047b
            [experiment/e2-multiprocess-silo-recovery]=8df38ab599ddb48140c38eb5e748e58aac5bbf5f
          )
          branches=(
            experiment/e1-postgres-row-locking
            experiment/e2-orleans-durable-ledger
            experiment/e2-multiprocess-silo-recovery
          )

          # Validate ALL candidates before deleting ANY of them.
          for branch in "${branches[@]}"; do
            current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            if [[ "$current" != "${expected[$branch]}" ]]; then
              echo "::error::Ref changed: $branch; refusing to remove anything."
              exit 1
            fi
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            if ! git merge-base --is-ancestor "$current" HEAD; then
              echo "::error::Unmerged work found on $branch; refusing cleanup."
              exit 1
            fi
            echo "Validated $branch at $current as ancestor of main."
          done

          # The maintenance PR head itself becomes obsolete after merge.
          # Its immutable expected SHA comes from the *merged* PR #20, so
          # the cleanup workflow never needs an impossible self-referential
          # hard-coded commit hash.
          maintenance="maintenance/prune-merged-e1-e2-experiment-branches"
          pr_merged="$(gh api "repos/$GITHUB_REPOSITORY/pulls/20" --jq '.merged')"
          test "$pr_merged" = "true" || {
            echo "::error::Cleanup PR #20 has not merged"; exit 1;
          }
          expected_maintenance="$(gh api "repos/$GITHUB_REPOSITORY/pulls/20" --jq '.head.sha')"
          current_maintenance="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$maintenance" --jq '.object.sha')"
          test "$current_maintenance" = "$expected_maintenance" || {
            echo "::error::Maintenance branch changed after merging"; exit 1;
          }
          git fetch --no-tags origin "refs/heads/$maintenance:refs/remotes/origin/$maintenance"
          git merge-base --is-ancestor "$expected_maintenance" HEAD || {
            echo "::error::Maintenance branch contains unmerged work"; exit 1;
          }

          # This YAML-repair PR also becomes obsolete after it merges.
          # Verify it via PR #21's recorded head SHA before any deletion.
          fix_branch="maintenance/fix-one-time-prune-workflow-yaml"
          fix_merged="$(gh api "repos/$GITHUB_REPOSITORY/pulls/21" --jq '.merged')"
          test "$fix_merged" = "true" || {
            echo "::error::Repair PR #21 has not merged"; exit 1;
          }
          expected_fix="$(gh api "repos/$GITHUB_REPOSITORY/pulls/21" --jq '.head.sha')"
          current_fix="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$fix_branch" --jq '.object.sha')"
          test "$current_fix" = "$expected_fix" || {
            echo "::error::Repair branch changed after merge"; exit 1;
          }
          git fetch --no-tags origin "refs/heads/$fix_branch:refs/remotes/origin/$fix_branch"
          git merge-base --is-ancestor "$expected_fix" HEAD || {
            echo "::error::Repair branch contains unmerged work"; exit 1;
          }

          for branch in "${branches[@]}"; do
            # Recheck immediately before each destructive API call.
            current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            test "$current" = "${expected[$branch]}" || {
              echo "::error::Concurrent ref update: $branch"; exit 1;
            }
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "Deleted verified merged branch: $branch"
          done

          current_maintenance="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$maintenance" --jq '.object.sha')"
          test "$current_maintenance" = "$expected_maintenance" || {
            echo "::error::Maintenance branch changed during cleanup"; exit 1;
          }
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$maintenance"
          echo "Deleted merged maintenance PR branch: $maintenance"
          current_fix="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$fix_branch" --jq '.object.sha')"
          test "$current_fix" = "$expected_fix" || {
            echo "::error::Repair branch changed during cleanup"; exit 1;
          }
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$fix_branch"
          echo "Deleted merged workflow-repair PR branch: $fix_branch"
