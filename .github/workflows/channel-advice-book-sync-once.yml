name: One-time build regenerated channel book editions
on:
  push:
    branches: [feature/channels-late-advice-reconciliation-30]
    paths: ['.github/workflows/channel-advice-book-sync-once.yml']
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/channels-late-advice-reconciliation-30
      - name: Rebuild ES and EN from the actual canonical channel chapters
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feature/channels-late-advice-reconciliation-30"
          python3 scripts/build.py
          git add book/es.md book/en.md
          if git diff --cached --quiet; then
            echo "Generated manuscripts already match source chapters"
            exit 0
          fi
          git -c user.name=github-actions[bot] \
            -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "docs(book): regenerate both editions for late advice research"
          git push origin HEAD:refs/heads/feature/channels-late-advice-reconciliation-30
