<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc">
<title id="title">M2: local PostgreSQL committed transfers per second, one to sixteen service processes</title>
<desc id="desc">Actual 20 experiments on one hosted runner, two protocols and uniform or hot-account distribution; increasing processes reduced throughput in this single-host test. Not cloud scale evidence.</desc>
